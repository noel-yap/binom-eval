name: Release

# Three ways in, one pipeline:
#   * A push to `main` runs `tag` first. It cuts the next vX.Y.Z tag with
#     scripts/release.sh --ci, or does nothing when there is nothing to release.
#     `build` and `github-release` then run in this same run against that tag.
#     A tag pushed with GITHUB_TOKEN does not start another workflow run, so
#     the new tag cannot trigger a second release.
#   * A manual run (workflow_dispatch) with an existing `tag` input skips `tag`
#     and builds + publishes that tag. Use it to recover a release whose tag was
#     cut but whose publish failed: re-running a failed main-push run cannot,
#     because `tag` then finds nothing new to release and skips the rest.
#   * A version tag pushed by a human (e.g. `git push origin v0.1.0`) skips
#     `tag` and runs `build` and `github-release` against that tag.
on:
  push:
    branches: [main]
    # Hand-cut tags, e.g. `v0.1.0`.
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and release (e.g. v2.11.0)
        required: true
        type: string

# Serialize releases so overlapping merges cannot race on tagging. Queued runs
# are not cancelled: cancelling mid-release could leave a tag with no Release.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# No token permissions by default. Each job below grants only what it needs.
permissions: {}

jobs:
  tag:
    name: Tag next version
    # Only for pushes to main. A pushed tag or a manual run also starts this
    # workflow; skip those.
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags: the bump is inferred from commits since the
          # last tag, and the tag is pushed with the persisted GITHUB_TOKEN.
          fetch-depth: 0

      - name: Cut release tag
        id: release
        env:
          # Annotated tags need a tagger identity; runners have none by default.
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        # Writes `tag=` to $GITHUB_OUTPUT only when it creates a tag.
        run: bash scripts/release.sh --ci

  build:
    name: Build sdist + wheel
    needs: tag
    # Runs after a successful `tag` step (main push that released), or directly
    # for a pushed version tag or a manual run. Skipped when `tag` found nothing
    # to release.
    if: >-
      always() && needs.tag.result != 'failure' && needs.tag.result != 'cancelled'
      && (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
          || needs.tag.outputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The tag to release: the manual input, the pushed tag, or the tag the
      # `tag` job just cut. Resolved once so the checkout and the version check
      # cannot disagree.
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_type == 'tag' && github.ref_name || needs.tag.outputs.tag }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          # Check out the tag, not the branch: on a main push the tag was just
          # created. Full history + tags so hatch-vcs can derive the version.
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build distributions
        run: uv build

      # Fail early if the tag (e.g. v0.1.0) doesn't match the built artifact's
      # version — keeps the Git tag and the artifact in lock-step. The version
      # is derived from the tag via hatch-vcs, so it is read from the built
      # wheel filename (`uv version` cannot read a dynamic version). Also
      # classify PEP 440 pre-release versions (e.g. 0.1.0rc1, 0.1.0a1) off the
      # normalized version so the GitHub Release is flagged correctly.
      - name: Verify tag and classify version
        id: version
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          tag="${TAG}"
          version="${tag#v}"
          pkg="$(ls dist/*.whl | sed -E 's|.*/[A-Za-z0-9_.]+-([0-9][^-]*)-.*\.whl$|\1|' | head -1)"
          if [ "${version}" != "${pkg}" ]; then
            echo "::error::tag ${tag} != built version ${pkg}" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          if [[ "${pkg}" =~ (a|b|rc|alpha|beta|dev|pre) ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    needs: build
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # `gh run download` needs to read this run's artifacts.
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.build.outputs.tag }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      # Only for scripts/retry.sh; the release itself is made from the tag.
      - name: Checkout
        uses: actions/checkout@v4

      # Artifact storage occasionally reports a just-uploaded artifact as
      # missing ("No artifacts found for ID ..."). Retry with exponential
      # backoff and jitter instead of failing the release.
      - name: Download distributions
        run: bash scripts/retry.sh -- gh run download "${GITHUB_RUN_ID}" --name dist --dir dist

      # Idempotent so a retry (or a manual re-run) after a partial failure is
      # safe: create the release if absent, then upload the files, replacing
      # any already attached.
      - name: Create GitHub Release
        run: |
          publish() {
            if ! gh release view "${TAG}" >/dev/null 2>&1; then
              flags=(--verify-tag --generate-notes)
              [ "${PRERELEASE}" = "true" ] && flags+=(--prerelease)
              gh release create "${TAG}" "${flags[@]}"
            fi
            gh release upload "${TAG}" dist/* --clobber
          }
          export -f publish
          export TAG PRERELEASE
          bash scripts/retry.sh -- bash -c 'set -e; publish'
